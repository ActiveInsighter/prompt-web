name: Verify AI Search project scope production

on:
  push:
    branches:
      - verify/ai-search-project-scope-production

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/ai-search-project-scope-production
          fetch-depth: 0

      - name: Query production endpoints
        shell: bash
        run: |
          set -euo pipefail

          query() {
            local name="$1"
            local url="$2"
            local body="/tmp/${name}.json"
            local status
            status="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 120 \
              --output "$body" --write-out '%{http_code}' "$url")"
            printf '%s' "$status" > "/tmp/${name}.status"
          }

          query info 'https://prompt.2212148739lbw.workers.dev/api/ai-search/info'
          query all 'https://prompt.2212148739lbw.workers.dev/api/ai-search?q=button&limit=3'
          query shadcn 'https://prompt.2212148739lbw.workers.dev/api/ai-search/shadcn-ui-docs?q=button&limit=3'
          query shadcn_v1 'https://prompt.2212148739lbw.workers.dev/api/v1/projects/shadcn-ui-docs/ai-search?q=button&limit=2'
          query zustand 'https://prompt.2212148739lbw.workers.dev/api/ai-search/zustand-docs?q=state&limit=3'
          query missing 'https://prompt.2212148739lbw.workers.dev/api/ai-search/project-that-does-not-exist?q=button'
          query hybrid 'https://prompt.2212148739lbw.workers.dev/api/ai-search?q=button&mode=hybrid&limit=2'

          python - <<'PY'
          import json
          from pathlib import Path

          names = ('info', 'all', 'shadcn', 'shadcn_v1', 'zustand', 'missing', 'hybrid')
          responses = {}
          for name in names:
              raw = Path(f'/tmp/{name}.json').read_text(encoding='utf-8')
              try:
                  body = json.loads(raw)
              except json.JSONDecodeError:
                  body = {'raw': raw[:5000]}
              responses[name] = {
                  'status': int(Path(f'/tmp/{name}.status').read_text()),
                  'body': body,
              }

          def scoped_ok(name, project):
              response = responses[name]
              body = response['body']
              results = body.get('results', [])
              scope = body.get('diagnostics', {}).get('projectScope', {})
              return (
                  response['status'] == 200
                  and body.get('query', {}).get('project', {}).get('slug') == project
                  and body.get('query', {}).get('mode') == 'vector'
                  and len(results) > 0
                  and all(item.get('source', {}).get('project') == project for item in results)
                  and scope.get('mode') == 'source'
                  and scope.get('strictSourceValidation') is True
                  and scope.get('strategy') in {
                      'source-key-filter',
                      'source-key-filter-with-project-hint',
                  }
                  and len(scope.get('attempts', [])) >= 1
              )

          all_body = responses['all']['body']
          hybrid_body = responses['hybrid']['body']
          missing_body = responses['missing']['body']
          checks = {
              'info': (
                  responses['info']['status'] == 200
                  and responses['info']['body'].get('service') == 'cloudflare-ai-search'
              ),
              'allProjects': (
                  responses['all']['status'] == 200
                  and all_body.get('query', {}).get('requestedMode') == 'auto'
                  and all_body.get('query', {}).get('mode') == 'vector'
                  and len(all_body.get('results', [])) > 0
                  and all_body.get('diagnostics', {}).get('projectScope') is None
              ),
              'shadcnProject': scoped_ok('shadcn', 'shadcn-ui-docs'),
              'shadcnV1Project': scoped_ok('shadcn_v1', 'shadcn-ui-docs'),
              'zustandProject': scoped_ok('zustand', 'zustand-docs'),
              'missingProject': (
                  responses['missing']['status'] == 404
                  and missing_body.get('error', {}).get('code') == 'project_not_found'
              ),
              'disabledHybridMode': (
                  responses['hybrid']['status'] == 400
                  and hybrid_body.get('error', {}).get('code') == 'retrieval_mode_unavailable'
                  and 'vector' in hybrid_body.get('error', {}).get('availableModes', [])
              ),
          }

          report = {
              'passed': all(checks.values()),
              'checks': checks,
              'responses': responses,
          }
          Path('.github/ai-search-project-scope-production-check.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit verification result
        run: |
          rm .github/workflows/temp-verify-ai-search-project-scope-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ai-search-project-scope-production-check.json .github/workflows/temp-verify-ai-search-project-scope-production.yml
          git commit -m "test: record AI Search project scope production verification"
          git push origin HEAD:verify/ai-search-project-scope-production
