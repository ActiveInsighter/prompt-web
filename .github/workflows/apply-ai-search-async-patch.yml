name: Finalize AI Search Async Patch

on:
  push:
    branches:
      - fix/ai-search-async-upload

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-async-upload
          fetch-depth: 0

      - name: Normalize async upload source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/ai-search-indexing-service.ts')
          lines = path.read_text(encoding='utf-8').splitlines()

          start = next(
              index for index, line in enumerate(lines)
              if 'Queue the document and return immediately' in line
          )
          end = next(
              index for index in range(start, len(lines))
              if lines[index].strip() == '});'
          )

          block = [
              '  // Queue the document and return immediately. AI Search performs parsing,',
              '  // chunking, and embedding asynchronously, so Worker request duration no',
              '  // longer controls whether the document eventually becomes searchable.',
              '  const uploaded = await provisioned.instance.items.upload(itemKey, file.content, {',
              '    metadata: {',
              '      file_id: file.file_id,',
              '      content_hash: file.content_hash,',
              '      visibility: file.visibility,',
              '    },',
              '  });',
          ]
          lines[start:end + 1] = block
          text = '\n'.join(lines) + '\n'

          if 'uploadAndPoll' in text or 'UPLOAD_POLL_TIMEOUT_MS' in text:
              raise RuntimeError('synchronous polling code remains after finalization')
          if 'items.upload(itemKey, file.content' not in text:
              raise RuntimeError('queued upload call is missing')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit finalized patch
        run: |
          rm .github/workflows/apply-ai-search-async-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/ai-search-indexing-service.ts .github/workflows/apply-ai-search-async-patch.yml
          git commit -m "fix: finalize queued AI Search uploads"
          git push origin HEAD:fix/ai-search-async-upload
