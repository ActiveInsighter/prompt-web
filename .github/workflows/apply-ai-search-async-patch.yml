name: Apply AI Search Async Patch

on:
  push:
    branches:
      - fix/ai-search-async-upload
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-async-upload
          fetch-depth: 0

      - name: Replace synchronous polling with queued upload
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/services/ai-search-indexing-service.ts')
          text = path.read_text(encoding='utf-8')

          text, constants_count = re.subn(
              r"const MAX_UPLOAD_BYTES = 4 \* 1024 \* 1024;\nconst MAX_JOB_ATTEMPTS = 5;\n// uploadAndPoll.*?\nconst UPLOAD_POLL_TIMEOUT_MS = 120_000;\nconst JOB_LEASE_SECONDS = 180;",
              "const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;\nconst MAX_JOB_ATTEMPTS = 5;\nconst JOB_LEASE_SECONDS = 120;",
              text,
              count=1,
              flags=re.DOTALL,
          )
          assert constants_count == 1, 'timeout constants block was not found'

          upload_pattern = re.compile(
              r"  const uploaded = await provisioned\.instance\.items\.uploadAndPoll\(itemKey, file\.content, \{\n"
              r".*?"
              r"  \}\);\n\n"
              r"  if \(uploaded\.status !== 'completed' && uploaded\.status !== 'skipped'\) \{\n"
              r".*?"
              r"  \}\n",
              re.DOTALL,
          )
          upload_replacement = """  // Queue the document and return immediately. AI Search performs parsing,
          // chunking, and embedding asynchronously, so Worker request duration no
          // longer controls whether the document eventually becomes searchable.
          const uploaded = await provisioned.instance.items.upload(itemKey, file.content, {
            metadata: {
              file_id: file.file_id,
              content_hash: file.content_hash,
              visibility: file.visibility,
            },
          });
          """
          text, upload_count = upload_pattern.subn(upload_replacement, text, count=1)
          assert upload_count == 1, 'uploadAndPoll block was not found'

          assert 'uploaded.chunks_count ?? null' in text, 'chunks_count binding was not found'
          text = text.replace('uploaded.chunks_count ?? null', 'null', 1)

          text = text.replace(
              '// AI Search indexing is mostly upstream waiting time. Run the bounded batch\n'
              '  // concurrently so three slow files do not consume up to six minutes serially.',
              '// Upload calls only enqueue work upstream, so a small bounded concurrent\n'
              '  // batch quickly drains the D1 outbox without exceeding Worker limits.',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source patch
        run: |
          rm .github/workflows/apply-ai-search-async-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/ai-search-indexing-service.ts .github/workflows/apply-ai-search-async-patch.yml
          git commit -m "fix: queue AI Search uploads asynchronously"
          git push origin HEAD:fix/ai-search-async-upload
