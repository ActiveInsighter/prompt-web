name: Apply AI Search Async Patch

on:
  push:
    branches:
      - fix/ai-search-async-upload

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-async-upload
          fetch-depth: 0

      - name: Replace synchronous polling with queued upload
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/ai-search-indexing-service.ts')
          text = path.read_text(encoding='utf-8')

          old_constants = """const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;
          const MAX_JOB_ATTEMPTS = 5;
          // uploadAndPoll may legitimately need more than the SDK's 30 second default.
          // Keep the D1 lease longer than the poll timeout so the next cron invocation
          // cannot claim the same file while an upload is still active.
          const UPLOAD_POLL_TIMEOUT_MS = 120_000;
          const JOB_LEASE_SECONDS = 180;
          """
          new_constants = """const MAX_UPLOAD_BYTES = 4 * 1024 * 1024;
          const MAX_JOB_ATTEMPTS = 5;
          const JOB_LEASE_SECONDS = 120;
          """
          assert old_constants in text, 'timeout constants block was not found'
          text = text.replace(old_constants, new_constants, 1)

          old_upload = """  const uploaded = await provisioned.instance.items.uploadAndPoll(itemKey, file.content, {
            metadata: {
              file_id: file.file_id,
              content_hash: file.content_hash,
              visibility: file.visibility,
            },
            pollIntervalMs: 1000,
            timeoutMs: UPLOAD_POLL_TIMEOUT_MS,
          });

          if (uploaded.status !== 'completed' && uploaded.status !== 'skipped') {
            throw new Error(`AI Search indexing returned ${uploaded.status} for ${file.file_id}.`);
          }
          """
          new_upload = """  // Queue the document and return immediately. AI Search performs parsing,
          // chunking, and embedding asynchronously, so Worker request duration no
          // longer controls whether the document eventually becomes searchable.
          const uploaded = await provisioned.instance.items.upload(itemKey, file.content, {
            metadata: {
              file_id: file.file_id,
              content_hash: file.content_hash,
              visibility: file.visibility,
            },
          });
          """
          assert old_upload in text, 'uploadAndPoll block was not found'
          text = text.replace(old_upload, new_upload, 1)

          old_chunks = """      file.content_hash,
                uploaded.chunks_count ?? null,
          """
          new_chunks = """      file.content_hash,
                null,
          """
          assert old_chunks in text, 'chunks_count binding was not found'
          text = text.replace(old_chunks, new_chunks, 1)

          old_comment = """  // AI Search indexing is mostly upstream waiting time. Run the bounded batch
            // concurrently so three slow files do not consume up to six minutes serially.
          """
          new_comment = """  // Upload calls only enqueue work upstream, so a small bounded concurrent
            // batch quickly drains the D1 outbox without exceeding Worker limits.
          """
          assert old_comment in text, 'batch comment was not found'
          text = text.replace(old_comment, new_comment, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source patch
        run: |
          rm .github/workflows/apply-ai-search-async-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/ai-search-indexing-service.ts .github/workflows/apply-ai-search-async-patch.yml
          git commit -m "fix: queue AI Search uploads asynchronously"
          git push origin HEAD:fix/ai-search-async-upload
