name: Apply AI Search Primary Session

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-d1-primary-session
          fetch-depth: 0

      - name: Use primary D1 sessions for AI Search maintenance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/index.ts')
          text = path.read_text(encoding='utf-8')

          old_maintenance = """async function runAiSearchMaintenance(env: Env, limit = 3) {
            const recovered = await reconcileAiSearchJobs(env);
            return { recovered, ...(await processAiSearchJobs(env, limit)) };
          }
          """
          new_maintenance = """function withPrimaryDatabaseSession(env: Env): Env {
            return {
              ...env,
              DB: env.DB.withSession('first-primary') as unknown as D1Database,
            };
          }

          async function runAiSearchMaintenance(env: Env, limit = 3) {
            const sessionEnv = withPrimaryDatabaseSession(env);
            const recovered = await reconcileAiSearchJobs(sessionEnv);
            return { recovered, ...(await processAiSearchJobs(sessionEnv, limit)) };
          }
          """
          if old_maintenance not in text:
              raise RuntimeError('maintenance block not found')
          text = text.replace(old_maintenance, new_maintenance, 1)

          old_status = """  return context.json(await getAiSearchIndexStatus(context.env));
          """
          new_status = """  return context.json(
            await getAiSearchIndexStatus(withPrimaryDatabaseSession(context.env)),
          );
          """
          if old_status not in text:
              raise RuntimeError('status route not found')
          text = text.replace(old_status, new_status, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source patch
        run: |
          rm .github/workflows/apply-ai-search-primary-session.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts .github/workflows/apply-ai-search-primary-session.yml
          git commit -m "fix: use primary D1 session for AI Search maintenance"
          git push origin HEAD:fix/ai-search-d1-primary-session
