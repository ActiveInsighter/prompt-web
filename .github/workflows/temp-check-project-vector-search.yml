name: Check project vector search

on:
  push:
    branches:
      - verify/ai-search-production

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/ai-search-production
          fetch-depth: 0
      - name: Query scoped vector search
        run: |
          set -euo pipefail
          url='https://prompt.2212148739lbw.workers.dev/api/ai-search/shadcn-ui-docs?q=button&limit=3&mode=vector&rerank=false&context=0'
          status="$(curl --silent --show-error --location --connect-timeout 15 --max-time 90 --output /tmp/body.json --write-out '%{http_code}' "$url")"
          STATUS="$status" python - <<'PY'
          import json, os
          from pathlib import Path
          raw = Path('/tmp/body.json').read_text(encoding='utf-8')
          try:
              body = json.loads(raw)
          except json.JSONDecodeError:
              body = {'raw': raw[:5000]}
          report = {'status': int(os.environ['STATUS']), 'body': body}
          Path('.github/ai-search-project-vector-check.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit result
        run: |
          rm .github/workflows/temp-check-project-vector-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ai-search-project-vector-check.json .github/workflows/temp-check-project-vector-search.yml
          git commit -m "test: record project vector search check"
          git push origin HEAD:verify/ai-search-production
