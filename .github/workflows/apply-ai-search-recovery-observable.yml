# One-time source patch; this workflow removes itself after success.
name: Apply Observable AI Search Recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-recovery-observable
          fetch-depth: 0

      - name: Make timeout recovery direct and observable
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('src/services/ai-search-indexing-service.ts')
          service_lines = service_path.read_text(encoding='utf-8').splitlines()

          signature_index = next(
              index for index, line in enumerate(service_lines)
              if line == 'export async function reconcileAiSearchJobs(env: Env): Promise<void> {'
          )
          service_lines[signature_index] = (
              'export async function reconcileAiSearchJobs(env: Env): Promise<number> {'
          )

          recovery_start = next(
              index for index, line in enumerate(service_lines)
              if 'Jobs created by the former uploadAndPoll implementation' in line
          )
          recovery_end = next(
              index for index in range(recovery_start, len(service_lines))
              if service_lines[index].strip() == ').run();'
          )
          recovery_block = [
              '  // Jobs created by the former uploadAndPoll implementation can be left in',
              '  // terminal failure. Reset only timeout failures; validation failures such as',
              '  // oversized files remain terminal and visible to operators.',
              '  const recovery = await env.DB.prepare(',
              '    `UPDATE ai_search_jobs',
              "     SET status = 'pending',",
              '         attempts = 0,',
              "         next_attempt_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),",
              '         lease_expires_at = NULL,',
              '         last_error = NULL,',
              "         updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),",
              '         completed_at = NULL',
              "     WHERE operation = 'upsert_file'",
              "       AND status = 'failed'",
              "       AND instr(lower(COALESCE(last_error, '')), 'timeout') > 0`,",
              '  ).run();',
          ]
          service_lines[recovery_start:recovery_end + 1] = recovery_block

          batch_start = next(
              index for index in range(recovery_start, len(service_lines))
              if 'for (let offset = 0; offset < statements.length; offset += 80)' in service_lines[index]
          )
          batch_end = next(
              index for index in range(batch_start + 1, len(service_lines))
              if service_lines[index] == '  }'
          )
          if service_lines[batch_end + 1] != '}':
              raise RuntimeError('reconcile function boundary not found')
          service_lines.insert(batch_end + 1, '  return Number(recovery.meta.changes ?? 0);')
          service_path.write_text('\n'.join(service_lines) + '\n', encoding='utf-8')

          index_path = Path('src/index.ts')
          index_lines = index_path.read_text(encoding='utf-8').splitlines()

          maintenance_start = next(
              index for index, line in enumerate(index_lines)
              if line == 'async function runAiSearchMaintenance(env: Env, limit = 3) {'
          )
          maintenance_end = next(
              index for index in range(maintenance_start + 1, len(index_lines))
              if index_lines[index] == '}'
          )
          index_lines[maintenance_start:maintenance_end + 1] = [
              'async function runAiSearchMaintenance(env: Env, limit = 3) {',
              '  const recovered = await reconcileAiSearchJobs(env);',
              '  return { recovered, ...(await processAiSearchJobs(env, limit)) };',
              '}',
          ]

          route_start = next(
              index for index, line in enumerate(index_lines)
              if line == "app.post('/api/admin/ai-search/process', async (context) => {"
          )
          reconcile_line = next(
              index for index in range(route_start, len(index_lines))
              if index_lines[index].strip() == 'await reconcileAiSearchJobs(context.env);'
          )
          if 'processAiSearchJobs' not in index_lines[reconcile_line + 1]:
              raise RuntimeError('process route return line not found')
          index_lines[reconcile_line:reconcile_line + 2] = [
              '  return context.json(await runAiSearchMaintenance(context.env, requestedLimit));',
          ]
          index_path.write_text('\n'.join(index_lines) + '\n', encoding='utf-8')
          PY

      - name: Commit recovery patch
        run: |
          rm .github/workflows/apply-ai-search-recovery-observable.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/ai-search-indexing-service.ts src/index.ts .github/workflows/apply-ai-search-recovery-observable.yml
          git commit -m "fix: make AI Search timeout recovery observable"
          git push origin HEAD:fix/ai-search-recovery-observable
