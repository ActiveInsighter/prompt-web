name: Apply search API simplification

on:
  push:
    branches:
      - simplify-search-api-vector-only
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-search-api-vector-only
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: transform
        continue-on-error: true
        run: node scripts/apply-search-api-simplification.mjs > .github/apply-search-api-simplification.log 2>&1

      - name: Commit diagnostic log
        if: steps.transform.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/apply-search-api-simplification.log
          git commit -m "chore: record simplification failure"
          git push origin HEAD:simplify-search-api-vector-only
          exit 1

      - if: steps.transform.outcome == 'success'
        run: npm install

      - if: steps.transform.outcome == 'success'
        run: npm run typecheck

      - if: steps.transform.outcome == 'success'
        run: npm run test:cloudflare-ai-search

      - if: steps.transform.outcome == 'success'
        run: npm run test:mcp-contracts

      - name: Commit generated changes
        if: steps.transform.outcome == 'success'
        run: |
          rm scripts/apply-search-api-simplification.mjs
          rm .github/workflows/apply-search-api-simplification.yml
          rm -f .github/search-api-simplification-trigger
          rm -f .github/apply-search-api-simplification.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify search APIs and fix vector retrieval"
          git push origin HEAD:simplify-search-api-vector-only
