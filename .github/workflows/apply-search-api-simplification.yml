name: Apply search API simplification

on:
  push:
    branches:
      - simplify-search-api-vector-only
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-search-api-vector-only
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: node scripts/apply-search-api-simplification.mjs

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:cloudflare-ai-search

      - run: npm run test:mcp-contracts

      - name: Commit generated changes
        run: |
          rm scripts/apply-search-api-simplification.mjs
          rm .github/workflows/apply-search-api-simplification.yml
          rm -f .github/search-api-simplification-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify search APIs and fix vector retrieval"
          git push origin HEAD:simplify-search-api-vector-only
