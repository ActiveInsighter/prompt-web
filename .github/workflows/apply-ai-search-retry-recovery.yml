name: Apply AI Search Retry Recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-retry-terminal-timeouts
          fetch-depth: 0

      - name: Use trigger-approved retry status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/ai-search-indexing-service.ts')
          lines = path.read_text(encoding='utf-8').splitlines()

          recovery_start = next(
              index for index, line in enumerate(lines)
              if 'const recoverableTimeoutJobs' in line
          )
          failed_where = next(
              index for index in range(recovery_start, len(lines))
              if "WHERE id = ? AND status = 'failed'" in lines[index]
          )
          status_line = next(
              index for index in range(failed_where, recovery_start, -1)
              if "SET status = 'pending'" in lines[index]
          )
          lines[status_line] = lines[status_line].replace("'pending'", "'retry'")

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit source patch
        run: |
          rm .github/workflows/apply-ai-search-retry-recovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/ai-search-indexing-service.ts .github/workflows/apply-ai-search-retry-recovery.yml
          git commit -m "fix: recover AI Search timeouts through retry status"
          git push origin HEAD:fix/ai-search-retry-terminal-timeouts
