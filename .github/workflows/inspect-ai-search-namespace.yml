name: Inspect AI Search namespace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Inspect namespaces and instances
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

          echo '===== NAMESPACES ====='
          npx wrangler ai-search namespace list --json

          echo '===== prompt-projects NAMESPACE ====='
          npx wrangler ai-search namespace get prompt-projects --json

          echo '===== prompt-projects INSTANCES ====='
          npx wrangler ai-search list --namespace prompt-projects --json

          echo '===== default INSTANCES ====='
          npx wrangler ai-search list --namespace default --json

          echo 'Inspection complete.'
