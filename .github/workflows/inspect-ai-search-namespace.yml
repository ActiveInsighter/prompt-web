name: Inspect AI Search namespace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect namespaces and instances
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-search"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          echo 'NAMESPACES='
          curl --fail --silent --show-error -H "$auth" "$api/namespaces" | jq -c '{success,result}'

          echo 'PROMPT_PROJECTS_NAMESPACE='
          curl --fail --silent --show-error -H "$auth" "$api/namespaces/prompt-projects" | jq -c '{success,result}'

          echo 'PROMPT_PROJECTS_INSTANCES='
          curl --fail --silent --show-error -H "$auth" "$api/namespaces/prompt-projects/instances?per_page=100" | jq -c '{success,result:[.result[]|{id,status,type,created_at,modified_at}]}'

          echo 'DEFAULT_INSTANCES='
          curl --fail --silent --show-error -H "$auth" "$api/namespaces/default/instances?per_page=100" | jq -c '{success,result:[.result[]|{id,status,type,created_at,modified_at}]}'
