name: Inspect AI Search namespace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect remote AI Search state
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-search"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          instances="$(curl --fail --silent --show-error -H "$auth" "$api/namespaces/prompt-projects/instances?per_page=100")"

          echo 'PROMPT_PROJECTS_REMOTE_STATE='
          while IFS= read -r id; do
            all='[]'
            for page in 1 2 3 4; do
              response="$(curl --fail --silent --show-error -H "$auth" "$api/namespaces/prompt-projects/instances/$id/items?per_page=100&page=$page")"
              batch="$(jq '.result // []' <<<"$response")"
              all="$(jq -nc --argjson current "$all" --argjson batch "$batch" '$current + $batch')"
              [[ "$(jq 'length' <<<"$batch")" -lt 100 ]] && break
            done

            instance_status="$(jq -r --arg id "$id" '.result[] | select(.id == $id) | .status' <<<"$instances")"
            jq -nc \
              --arg instance_id "$id" \
              --arg instance_status "$instance_status" \
              --argjson items "$all" \
              '{instance_id:$instance_id,instance_status:$instance_status,item_count:($items|length),item_statuses:($items|group_by(.status)|map({key:(.[0].status//"unknown"),value:length})|from_entries),chunk_count:([$items[].chunks_count//0]|add//0)}'
          done < <(jq -r '.result[].id' <<<"$instances")
