name: Refresh external docs

on:
  schedule:
    # Twice monthly: the 1st and 16th at 03:17 UTC.
    - cron: '17 3 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-external-docs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Refresh shadcn/ui docs
        run: python -m scripts.cli collect shadcn_docs --config scripts/configs/shadcn-docs.yaml

      - name: Refresh Zustand docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.cli collect zustand_docs --config scripts/configs/zustand-docs.yaml

      - name: Refresh Tailwind CSS docs
        run: python -m scripts.cli collect tailwindcss_docs --config scripts/configs/tailwindcss-docs.yaml

      - name: Validate refreshed content and project
        run: npm run project:ci

      - name: Create or update refresh pull request
        id: pull_request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/refresh-external-docs
          delete-branch: true
          commit-message: 'Refresh external documentation'
          title: 'Refresh external documentation'
          body: |
            Automated twice-monthly refresh of repository-managed external documentation.

            - shadcn/ui docs sidebar
            - pmndrs/zustand `docs/`
            - Tailwind CSS official docs sidebar and rendered pages
          add-paths: |
            content/shadcn-ui-docs
            content/zustand-docs
            content/tailwindcss-docs

      - name: Write refresh summary
        if: always()
        env:
          PR_URL: ${{ steps.pull_request.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pull_request.outputs.pull-request-operation }}
        run: |
          {
            echo '## External documentation refresh'
            echo
            echo "- Pull request operation: ${PR_OPERATION:-none}"
            echo "- Pull request: ${PR_URL:-no content changes}"
          } >> "$GITHUB_STEP_SUMMARY"
