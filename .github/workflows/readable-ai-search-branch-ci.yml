name: Readable AI Search branch CI

on:
  push:
    branches:
      - fix/readable-ai-search-layout
    paths-ignore:
      - '.github/readable-ai-search-ci-result.json'
      - '.github/readable-ai-search-ci.log'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Run project checks
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run project:ci 2>&1 | tee .github/readable-ai-search-ci.log

      - name: Persist result
        if: always()
        shell: bash
        env:
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
        run: |
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('.github/readable-ai-search-ci-result.json', `${JSON.stringify({
            run_id: process.env.GITHUB_RUN_ID,
            commit: process.env.GITHUB_SHA,
            outcome: process.env.CHECK_OUTCOME,
          }, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/readable-ai-search-ci-result.json .github/readable-ai-search-ci.log
          git commit -m 'record readable AI Search CI result [skip ci]' || exit 0
          git push

      - name: Fail when checks fail
        if: steps.checks.outcome != 'success'
        run: exit 1
