name: Check Live AI Search

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query live AI Search
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://prompt.2212148739lbw.workers.dev/api/ai-search/tailwindcss-docs?q=padding&limit=5';
          const response = await fetch(url, {
            headers: { accept: 'application/json' },
            signal: AbortSignal.timeout(60_000),
          });
          const raw = await response.text();
          console.log('STATUS=' + response.status);
          if (!response.ok) throw new Error(raw);
          const data = JSON.parse(raw);
          const result = data?.results?.find((item) => item?.path === '/spacing/padding.md');
          if (!result) throw new Error('padding.md result was not returned: ' + raw.slice(0, 2000));
          const text = result.text ?? '';
          console.log('RESULT_PATH=' + result.path);
          console.log('PARSED_TEXT_PREFIX=' + JSON.stringify(text.slice(0, 1800)));
          console.log('HAS_ESCAPED_HEADING=' + text.includes('\\# padding'));
          console.log('HAS_ESCAPED_BACKTICK=' + text.includes('\\`'));
          console.log('HAS_ESCAPED_BRACKET=' + text.includes('\\['));
          console.log('HAS_LITERAL_HEADING=' + text.includes('# padding'));
          console.log('HAS_LITERAL_BACKTICK=' + text.includes('`'));
          console.log('HAS_LITERAL_NUMBER_TAG=' + text.includes('<number>'));
          console.log('HAS_ONE_LITERAL_UNICODE_ESCAPE=' + text.includes('\\u003cnumber\\u003e'));
          console.log('HAS_DOUBLE_LITERAL_UNICODE_ESCAPE=' + text.includes('\\\\u003cnumber\\\\u003e'));
          console.log('FIRST_NUMBER_INDEX=' + text.indexOf('number'));
          const numberIndex = text.indexOf('number');
          console.log('NUMBER_CONTEXT=' + JSON.stringify(text.slice(Math.max(0, numberIndex - 20), numberIndex + 30)));
          NODE
