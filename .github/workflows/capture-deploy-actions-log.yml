name: Capture deploy Actions log

on:
  workflow_run:
    workflows:
      - Deploy Prompt MCP Worker
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: prompt-web-deploy-log-main
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch completed deployment metadata and logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/get-latest-run.mjs --run-id "$TARGET_RUN_ID" --logs --write

      - name: Prepare dedicated deployment state files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const source = JSON.parse(await fs.readFile('.github/latest-run.json', 'utf8'));
          const keys = [
            'run_id',
            'run_number',
            'run_attempt',
            'run_url',
            'workflow',
            'event_name',
            'branch',
            'head_sha',
            'status',
            'conclusion',
            'created_at',
            'updated_at'
          ];
          const deployment = Object.fromEntries(keys.map((key) => [key, source[key] ?? null]));
          deployment.actions_log_file = '.github/latest-deploy-actions-log.txt';
          await fs.writeFile(
            '.github/latest-deploy-run.json',
            `${JSON.stringify(deployment, null, 2)}\n`,
            'utf8'
          );
          await fs.copyFile(
            '.github/latest-actions-log.txt',
            '.github/latest-deploy-actions-log.txt'
          );
          NODE

          git restore -- \
            .github/latest-run-id.txt \
            .github/latest-run-url.txt \
            .github/latest-run.json \
            .github/latest-actions-log.txt

      - name: Commit deployment log state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/latest-deploy-run.json \
            .github/latest-deploy-actions-log.txt

          if git diff --cached --quiet; then
            echo 'No deployment log changes to commit.'
            exit 0
          fi

          git commit -m 'Record latest deploy Actions log [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main
          done
          exit 1
