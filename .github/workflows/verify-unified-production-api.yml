name: Verify Unified Production API

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - Deploy Prompt MCP Worker
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-unified-production-api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify directory, file, search, and indexing endpoints
        shell: bash
        env:
          BASE_URL: https://prompt.2212148739lbw.workers.dev
          VERIFY_AI_SEARCH_INDEX: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          get_json() {
            local url="$1"
            local output="$2"
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 12 \
              --retry-delay 3 \
              --retry-all-errors \
              --max-time 20 \
              --header 'Accept: application/json' \
              --output "$output" \
              "$url"
          }

          get_text() {
            local url="$1"
            local output="$2"
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 12 \
              --retry-delay 3 \
              --retry-all-errors \
              --max-time 20 \
              --output "$output" \
              "$url"
          }

          get_json "$BASE_URL/api/files/shadcn-ui-docs" "$temp_dir/project-no-slash.json"
          get_json "$BASE_URL/api/files/shadcn-ui-docs/" "$temp_dir/project-slash.json"
          get_json "$BASE_URL/api/files/shadcn-ui-docs/components/" "$temp_dir/components.json"
          get_json "$BASE_URL/api/files/shadcn-ui-docs/components/progress.md" "$temp_dir/file.json"
          get_json "$BASE_URL/api/files/shadcn-ui-docs/components/progress.md/" "$temp_dir/file-slash.json"
          get_json "$BASE_URL/api/v1/search/?q=progress&project=shadcn-ui-docs&path=/components&limit=5" "$temp_dir/search-get.json"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 3 \
            --retry-all-errors \
            --max-time 20 \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{"query":"progress","filters":{"project":"shadcn-ui-docs","pathPrefix":"/components"},"options":{"limit":5}}' \
            --output "$temp_dir/search-post.json" \
            "$BASE_URL/api/v1/search/"

          if [[ "$VERIFY_AI_SEARCH_INDEX" == "true" ]]; then
            get_json "$BASE_URL/api/files" "$temp_dir/api-root-no-slash.json"
            get_json "$BASE_URL/api/files/" "$temp_dir/api-root-slash.json"
            get_text "$BASE_URL/ai-index" "$temp_dir/ai-index-root.html"
            get_text "$BASE_URL/ai-index/" "$temp_dir/ai-index-root-slash.html"
            get_text "$BASE_URL/ai-index/shadcn-ui-docs" "$temp_dir/ai-index-project.html"
            get_text "$BASE_URL/ai-index/shadcn-ui-docs/components/progress.md" "$temp_dir/ai-index-file.txt"
            get_text "$BASE_URL/robots.txt" "$temp_dir/robots.txt"
            get_text "$BASE_URL/sitemap.xml" "$temp_dir/sitemap.xml"
          fi

          TEMP_DIR="$temp_dir" \
          VERIFY_AI_SEARCH_INDEX="$VERIFY_AI_SEARCH_INDEX" \
          BASE_URL="$BASE_URL" \
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const directory = process.env.TEMP_DIR;
          const readJson = (name) => JSON.parse(readFileSync(join(directory, name), 'utf8'));
          const readText = (name) => readFileSync(join(directory, name), 'utf8');

          const projectNoSlash = readJson('project-no-slash.json');
          const projectSlash = readJson('project-slash.json');
          const components = readJson('components.json');
          const file = readJson('file.json');
          const fileSlash = readJson('file-slash.json');
          const getSearch = readJson('search-get.json');
          const postSearch = readJson('search-post.json');

          for (const [name, value] of [
            ['project without slash', projectNoSlash],
            ['project with slash', projectSlash],
          ]) {
            if (
              value.schemaVersion !== '1.0' ||
              value.type !== 'directory' ||
              value.project?.slug !== 'shadcn-ui-docs' ||
              value.path !== '/' ||
              !Array.isArray(value.entries) ||
              value.entries.length === 0
            ) {
              throw new Error(`Invalid ${name} response: ${JSON.stringify(value)}`);
            }
          }

          if (
            components.type !== 'directory' ||
            components.path !== '/components' ||
            !components.entries.some((entry) => entry.type === 'file' && entry.name === 'progress.md')
          ) {
            throw new Error(`Invalid components directory response: ${JSON.stringify(components)}`);
          }

          for (const [name, value] of [
            ['file without slash', file],
            ['file with slash', fileSlash],
          ]) {
            if (
              value.type !== 'file' ||
              value.uri !== 'prompt://shadcn-ui-docs/components/progress.md' ||
              !value.content.includes('<Progress') ||
              !value.content.includes('<TabsTrigger')
            ) {
              throw new Error(`Invalid ${name} response: ${JSON.stringify({ type: value.type, uri: value.uri })}`);
            }
          }

          for (const [name, value] of [
            ['GET search', getSearch],
            ['POST search', postSearch],
          ]) {
            if (
              value.schemaVersion !== '1.0' ||
              !Array.isArray(value.results) ||
              !value.results.some((item) => item.path === '/components/progress.md')
            ) {
              throw new Error(`Invalid ${name} response: ${JSON.stringify(value)}`);
            }
          }

          if (process.env.VERIFY_AI_SEARCH_INDEX === 'true') {
            const apiRootNoSlash = readJson('api-root-no-slash.json');
            const apiRootSlash = readJson('api-root-slash.json');
            const aiIndexRoot = readText('ai-index-root.html');
            const aiIndexRootSlash = readText('ai-index-root-slash.html');
            const aiIndexProject = readText('ai-index-project.html');
            const aiIndexFile = readText('ai-index-file.txt');
            const robots = readText('robots.txt');
            const sitemap = readText('sitemap.xml');

            for (const [name, value] of [
              ['API root without slash', apiRootNoSlash],
              ['API root with slash', apiRootSlash],
            ]) {
              if (
                value.schemaVersion !== '1.1' ||
                value.type !== 'directory' ||
                value.path !== '/' ||
                !Array.isArray(value.entries) ||
                !value.entries.some((entry) => entry.type === 'project' && entry.slug === 'shadcn-ui-docs')
              ) {
                throw new Error(`Invalid ${name} response: ${JSON.stringify(value)}`);
              }
            }

            for (const [name, html] of [
              ['AI index root without slash', aiIndexRoot],
              ['AI index root with slash', aiIndexRootSlash],
            ]) {
              if (
                !html.startsWith('<!doctype html>') ||
                !html.includes(`<link rel="canonical" href="${process.env.BASE_URL}/ai-index">`) ||
                !html.includes(`href="${process.env.BASE_URL}/ai-index/shadcn-ui-docs"`)
              ) {
                throw new Error(`Invalid ${name}: ${html.slice(0, 500)}`);
              }
            }

            if (
              !aiIndexProject.startsWith('<!doctype html>') ||
              !aiIndexProject.includes(
                `href="${process.env.BASE_URL}/ai-index/shadcn-ui-docs/components"`,
              )
            ) {
              throw new Error(`Invalid AI index project directory: ${aiIndexProject.slice(0, 500)}`);
            }

            if (
              !aiIndexFile.includes('\\u003cProgress') ||
              !aiIndexFile.includes('\\u003cTabsTrigger') ||
              aiIndexFile.includes('<Progress')
            ) {
              throw new Error(`Invalid AI index document response: ${aiIndexFile.slice(0, 500)}`);
            }

            if (
              !robots.includes('User-agent: Cloudflare-AI-Search') ||
              !robots.includes('Allow: /ai-index/') ||
              !robots.includes('Disallow: /raw/') ||
              !robots.includes('Disallow: /api/') ||
              !robots.includes(`Sitemap: ${process.env.BASE_URL}/sitemap.xml`)
            ) {
              throw new Error(`Invalid robots.txt: ${robots}`);
            }

            if (
              !sitemap.startsWith('<?xml version="1.0" encoding="UTF-8"?>') ||
              !sitemap.includes(
                `<loc>${process.env.BASE_URL}/ai-index/shadcn-ui-docs/components/progress.md</loc>`,
              ) ||
              sitemap.includes(`<loc>${process.env.BASE_URL}/api/files`) ||
              sitemap.includes(`<loc>${process.env.BASE_URL}/raw/`) ||
              !sitemap.includes('<lastmod>')
            ) {
              throw new Error('AI Search sitemap is missing required /ai-index URLs or metadata.');
            }
          }

          console.log('Unified production API verification passed.');
          NODE
