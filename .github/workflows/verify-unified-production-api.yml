name: Verify Unified Production API

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - Deploy Prompt MCP Worker
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-unified-production-api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify directory, file, lexical search, and built-in AI Search endpoints
        shell: bash
        env:
          BASE_URL: https://prompt.2212148739lbw.workers.dev
          VERIFY_AI_SEARCH_SERVICE: true
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          get_json() {
            local url="$1"
            local output="$2"
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 12 \
              --retry-delay 3 \
              --retry-all-errors \
              --max-time 20 \
              --header 'Accept: application/json' \
              --output "$output" \
              "$url"
          }

          get_json "$BASE_URL/api/files/shadcn-ui-docs" "$temp_dir/project-no-slash.json"
          get_json "$BASE_URL/api/files/shadcn-ui-docs/" "$temp_dir/project-slash.json"
          get_json "$BASE_URL/api/files/shadcn-ui-docs/components/" "$temp_dir/components.json"
          get_json "$BASE_URL/api/files/shadcn-ui-docs/components/progress.md" "$temp_dir/file.json"
          get_json "$BASE_URL/api/files/shadcn-ui-docs/components/progress.md/" "$temp_dir/file-slash.json"
          get_json "$BASE_URL/api/v1/search/?q=progress&project=shadcn-ui-docs&path=/components&limit=5" "$temp_dir/search-get.json"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 3 \
            --retry-all-errors \
            --max-time 20 \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{"query":"progress","filters":{"project":"shadcn-ui-docs","pathPrefix":"/components"},"options":{"limit":5}}' \
            --output "$temp_dir/search-post.json" \
            "$BASE_URL/api/v1/search/"

          if [[ "$VERIFY_AI_SEARCH_SERVICE" == "true" ]]; then
            get_json "$BASE_URL/api/files" "$temp_dir/api-root-no-slash.json"
            get_json "$BASE_URL/api/files/" "$temp_dir/api-root-slash.json"
            get_json "$BASE_URL/api/ai-search/info" "$temp_dir/ai-search-info.json"

            ai_search_ready=false
            for attempt in $(seq 1 6); do
              if get_json \
                "$BASE_URL/api/ai-search/shadcn-ui-docs?q=progress&limit=5&threshold=0" \
                "$temp_dir/ai-search.json"; then
                if AI_SEARCH_FILE="$temp_dir/ai-search.json" node --input-type=module -e '
                  import { readFileSync } from "node:fs";
                  const response = JSON.parse(readFileSync(process.env.AI_SEARCH_FILE, "utf8"));
                  const valid = response.ok !== false &&
                    Array.isArray(response.results) &&
                    Number(response.count ?? 0) > 0 &&
                    response.results.some((item) =>
                      typeof item.uri === "string" &&
                      item.uri.startsWith("prompt://shadcn-ui-docs/")
                    );
                  process.exit(valid ? 0 : 1);
                '; then
                  ai_search_ready=true
                  break
                fi
              fi
              sleep 2
            done

            if [[ "$ai_search_ready" != "true" ]]; then
              echo 'Built-in AI Search did not return a hydrated shadcn-ui-docs result.' >&2
              if [[ -f "$temp_dir/ai-search.json" ]]; then
                cat "$temp_dir/ai-search.json" >&2
                echo >&2
              fi
              exit 1
            fi
          fi

          TEMP_DIR="$temp_dir" \
          VERIFY_AI_SEARCH_SERVICE="$VERIFY_AI_SEARCH_SERVICE" \
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const directory = process.env.TEMP_DIR;
          const readJson = (name) => JSON.parse(readFileSync(join(directory, name), 'utf8'));

          const projectNoSlash = readJson('project-no-slash.json');
          const projectSlash = readJson('project-slash.json');
          const components = readJson('components.json');
          const file = readJson('file.json');
          const fileSlash = readJson('file-slash.json');
          const getSearch = readJson('search-get.json');
          const postSearch = readJson('search-post.json');

          for (const [name, value] of [
            ['project without slash', projectNoSlash],
            ['project with slash', projectSlash],
          ]) {
            if (
              value.schemaVersion !== '1.0' ||
              value.type !== 'directory' ||
              value.project?.slug !== 'shadcn-ui-docs' ||
              value.path !== '/' ||
              !Array.isArray(value.entries) ||
              value.entries.length === 0
            ) {
              throw new Error(`Invalid ${name} response: ${JSON.stringify(value)}`);
            }
          }

          if (
            components.type !== 'directory' ||
            components.path !== '/components' ||
            !components.entries.some((entry) => entry.type === 'file' && entry.name === 'progress.md')
          ) {
            throw new Error(`Invalid components directory response: ${JSON.stringify(components)}`);
          }

          for (const [name, value] of [
            ['file without slash', file],
            ['file with slash', fileSlash],
          ]) {
            if (
              value.type !== 'file' ||
              value.uri !== 'prompt://shadcn-ui-docs/components/progress.md' ||
              !value.content.includes('<Progress') ||
              !value.content.includes('<TabsTrigger')
            ) {
              throw new Error(`Invalid ${name} response: ${JSON.stringify({ type: value.type, uri: value.uri })}`);
            }
          }

          for (const [name, value] of [
            ['GET search', getSearch],
            ['POST search', postSearch],
          ]) {
            if (
              value.schemaVersion !== '1.0' ||
              !Array.isArray(value.results) ||
              !value.results.some((item) => item.path === '/components/progress.md')
            ) {
              throw new Error(`Invalid ${name} response: ${JSON.stringify(value)}`);
            }
          }

          if (process.env.VERIFY_AI_SEARCH_SERVICE === 'true') {
            const apiRootNoSlash = readJson('api-root-no-slash.json');
            const apiRootSlash = readJson('api-root-slash.json');
            const aiSearchInfo = readJson('ai-search-info.json');
            const aiSearch = readJson('ai-search.json');

            for (const [name, value] of [
              ['API root without slash', apiRootNoSlash],
              ['API root with slash', apiRootSlash],
            ]) {
              if (
                value.schemaVersion !== '1.1' ||
                value.type !== 'directory' ||
                value.path !== '/' ||
                !Array.isArray(value.entries) ||
                !value.entries.some((entry) => entry.type === 'project' && entry.slug === 'shadcn-ui-docs') ||
                value.semanticIndex?.engine !== 'cloudflare-ai-search' ||
                value.semanticIndex?.storage !== 'built-in-items' ||
                value.semanticIndex?.isolation !== 'project-instance'
              ) {
                throw new Error(`Invalid ${name} response: ${JSON.stringify(value)}`);
              }
            }

            if (
              aiSearchInfo.schemaVersion !== '2.0' ||
              aiSearchInfo.service !== 'cloudflare-ai-search' ||
              aiSearchInfo.storage !== 'built-in-items' ||
              aiSearchInfo.isolation !== 'one-instance-per-project' ||
              aiSearchInfo.endpoints?.oneProject !== '/api/ai-search/<project>?q=<query>'
            ) {
              throw new Error(`Invalid built-in AI Search discovery response: ${JSON.stringify(aiSearchInfo)}`);
            }

            if (
              aiSearch.ok === false ||
              !Array.isArray(aiSearch.results) ||
              Number(aiSearch.count ?? 0) < 1 ||
              !aiSearch.results.some((item) =>
                typeof item.uri === 'string' && item.uri.startsWith('prompt://shadcn-ui-docs/')
              )
            ) {
              throw new Error(`Built-in AI Search returned no hydrated project result: ${JSON.stringify(aiSearch)}`);
            }
          }

          console.log('Unified production API verification passed.');
          NODE
