name: Apply AI Search upload repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-search-migration-continuity

      - name: Apply upload and verification repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/ai-search-indexing-remote.ts')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              "  buildAiSearchItemKey,\n  buildProjectAiSearchInstanceId,",
              "  buildAiSearchItemKey,\n  buildAiSearchUploadContent,\n  buildProjectAiSearchInstanceId,",
              1,
          )

          old_upload = """  const uploadBytes = new TextEncoder().encode(file.content).byteLength;
  if (uploadBytes > MAX_UPLOAD_BYTES) {
    throw new RangeError(
      `AI Search item ${file.path} is ${uploadBytes} bytes; the maximum is ${MAX_UPLOAD_BYTES}.`,
    );
  }
"""
          new_upload = """  const uploadContent = buildAiSearchUploadContent(file.path, file.content, file.format);
  const uploadBytes = new TextEncoder().encode(uploadContent).byteLength;
  if (uploadBytes > MAX_UPLOAD_BYTES) {
    throw new RangeError(
      `AI Search item ${file.path} is ${uploadBytes} bytes; the maximum is ${MAX_UPLOAD_BYTES}.`,
    );
  }
"""
          if old_upload not in source:
              raise SystemExit('upload byte block not found')
          source = source.replace(old_upload, new_upload, 1)

          old_call = """  const uploaded = await provisioned.instance.items.upload(itemKey, file.content, {
"""
          new_call = """  const uploaded = await provisioned.instance.items.upload(itemKey, uploadContent, {
"""
          if old_call not in source:
              raise SystemExit('upload call not found')
          source = source.replace(old_call, new_call, 1)

          old_catch = """      } catch (error) {
        const message = `Could not verify Cloudflare AI Search item: ${errorMessage(error)}`.slice(0, 4000);
        await env.DB.prepare(
          `UPDATE ai_search_items
           SET status = 'error',
               last_error = ?,
               checked_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
               updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
           WHERE file_id = ? AND item_id = ?`,
        )
          .bind(message, item.file_id, item.item_id)
          .run();
        await requeueFile(env, item.file_id);
        result.remoteErrors += 1;
      }
"""
          new_catch = """      } catch (error) {
        const message = `Could not verify Cloudflare AI Search item yet: ${errorMessage(error)}`.slice(0, 4000);
        // Item metadata can be briefly unavailable immediately after upload.
        // Keep the current remote Item and check it again later; re-uploading
        // on a transient lookup failure creates duplicate running revisions.
        await env.DB.prepare(
          `UPDATE ai_search_items
           SET status = 'processing',
               last_error = ?,
               checked_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
               updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
           WHERE file_id = ? AND item_id = ?`,
        )
          .bind(message, item.file_id, item.item_id)
          .run();
      }
"""
          if old_catch not in source:
              raise SystemExit('verification catch block not found')
          source = source.replace(old_catch, new_catch, 1)

          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/apply-ai-search-upload-repair.yml').unlink()
          PY

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/ai-search-indexing-remote.ts .github/workflows/apply-ai-search-upload-repair.yml
          git commit -m 'repair AI Search empty Markdown and transient verification'
          git push origin HEAD:fix/ai-search-migration-continuity
