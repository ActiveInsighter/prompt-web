name: Deploy Prompt MCP Worker

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/latest-run-id.txt'
      - '.github/latest-run-url.txt'
      - '.github/latest-run.json'
      - '.github/build-history.json'
      - '.github/latest-build-log.txt'
      - '.github/latest-actions-log.txt'
      - '.github/latest-deploy-run.json'
      - '.github/latest-deploy-actions-log.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MCP_BEARER_TOKEN: ${{ secrets.MCP_BEARER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Build content manifest
        run: |
          python -m scripts.cli validate
          python -m scripts.cli build

      - name: Render production Wrangler config
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        run: node scripts/render-wrangler-config.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local --config wrangler.deploy.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Seed public KV prompts
        run: npx wrangler kv bulk put seed/kv-prompts.json --binding PROMPT_KV --remote --config wrangler.deploy.jsonc

      # Upload code and synchronization credentials in one Worker version. Splitting
      # secret rotation and deployment across versions can leave the sync client using
      # a token that is not bound to the version currently serving production traffic.
      - name: Prepare atomic Worker secrets file
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "CONTENT_SYNC_TOKEN=$token" >> "$GITHUB_ENV"

          CONTENT_SYNC_TOKEN="$token" python - <<'PY'
          import json
          import os
          from pathlib import Path

          secrets = {"CONTENT_SYNC_TOKEN": os.environ["CONTENT_SYNC_TOKEN"]}
          mcp_token = os.environ.get("MCP_BEARER_TOKEN", "").strip()
          if mcp_token:
              secrets["MCP_BEARER_TOKEN"] = mcp_token

          Path(".wrangler.secrets.json").write_text(
              json.dumps(secrets, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          chmod 600 .wrangler.secrets.json

      - name: Deploy Worker with atomic secrets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.deploy.jsonc --secrets-file .wrangler.secrets.json

      - name: Synchronize repository content
        env:
          PROMPT_API_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: python -m scripts.cli sync --base-url "$PROMPT_API_BASE_URL" --prune

      - name: Prime AI Search index
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL" || { echo 'Wrangler did not return a deployment URL.'; exit 1; }
          base_url="${DEPLOYMENT_URL%/}"
          ready=false

          for attempt in $(seq 1 8); do
            process_json="$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time 300 \
              --request POST \
              --header "Authorization: Bearer $CONTENT_SYNC_TOKEN" \
              "$base_url/api/admin/ai-search/process?limit=10")"
            status_json="$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              --header "Authorization: Bearer $CONTENT_SYNC_TOKEN" \
              "$base_url/api/admin/ai-search/status")"

            echo "ai_search_process=$process_json"
            echo "ai_search_status=$status_json"

            state="$(AI_SEARCH_STATUS_JSON="$status_json" node --input-type=module -e 'const status = JSON.parse(process.env.AI_SEARCH_STATUS_JSON ?? "{}"); const failed = Number(status.jobs?.failed ?? 0); const readyProjects = Number(status.projects?.ready ?? 0); const indexedItems = Number(status.items?.indexed ?? 0); console.log(failed > 0 ? "failed" : readyProjects > 0 && indexedItems > 0 ? "ready" : "pending");')"

            case "$state" in
              ready)
                ready=true
                break
                ;;
              failed)
                echo 'AI Search indexing produced a terminal failure.' >&2
                exit 1
                ;;
              *)
                sleep 2
                ;;
            esac
          done

          if [[ "$ready" != 'true' ]]; then
            echo 'AI Search did not create a ready project instance and indexed item in time.' >&2
            exit 1
          fi

      - name: Smoke test deployed Worker
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL" || { echo 'Wrangler did not return a deployment URL.'; exit 1; }
          base_url="${DEPLOYMENT_URL%/}"
          echo "Testing $base_url"

          request_body() {
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 6 \
              --retry-delay 2 \
              --retry-all-errors \
              --max-time 30 \
              "$1"
          }

          frontend_html="$(request_body "$base_url/")"
          viewer_html="$(request_body "$base_url/p/prompt-library/guides/content-sync.md")"
          raw_markdown="$(request_body "$base_url/raw/prompt-library/guides/content-sync.md")"
          info_json="$(request_body "$base_url/api/info")"
          health_json="$(request_body "$base_url/health")"
          projects_json="$(request_body "$base_url/api/projects")"
          bootstrap_json="$(request_body "$base_url/api/bootstrap/chatgpt/default")"
          search_json="$(request_body "$base_url/api/files/search?q=sync&project=prompt-library&limit=5")"
          file_json="$(request_body "$base_url/api/files/fetch?identifier=prompt-library-content-sync-guide")"
          ai_search_info_json="$(request_body "$base_url/api/ai-search/info")"

          ai_search_json='{"count":0,"results":[]}'
          for attempt in $(seq 1 6); do
            ai_search_json="$(request_body "$base_url/api/ai-search?q=documentation&limit=3&threshold=0")"
            if AI_SEARCH_JSON="$ai_search_json" node --input-type=module -e 'const response = JSON.parse(process.env.AI_SEARCH_JSON ?? "{}"); process.exit(Number(response.count ?? 0) > 0 && Array.isArray(response.results) ? 0 : 1);'; then
              break
            fi
            sleep 2
          done

          echo "info=$info_json"
          echo "health=$health_json"
          echo "projects=$projects_json"
          echo "bootstrap=$bootstrap_json"
          echo "search=$search_json"
          echo "file=$file_json"
          echo "ai_search_info=$ai_search_info_json"
          echo "ai_search=$ai_search_json"
          echo "raw_markdown_prefix=${raw_markdown:0:120}"

          FRONTEND_HTML="$frontend_html" \
          VIEWER_HTML="$viewer_html" \
          RAW_MARKDOWN="$raw_markdown" \
          INFO_JSON="$info_json" \
          HEALTH_JSON="$health_json" \
          PROJECTS_JSON="$projects_json" \
          BOOTSTRAP_JSON="$bootstrap_json" \
          SEARCH_JSON="$search_json" \
          FILE_JSON="$file_json" \
          AI_SEARCH_INFO_JSON="$ai_search_info_json" \
          AI_SEARCH_JSON="$ai_search_json" \
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('.prompt-sync/manifest.json', 'utf8'));
          const frontend = process.env.FRONTEND_HTML ?? '';
          const viewer = process.env.VIEWER_HTML ?? '';
          const rawMarkdown = process.env.RAW_MARKDOWN ?? '';
          const info = JSON.parse(process.env.INFO_JSON);
          const health = JSON.parse(process.env.HEALTH_JSON);
          const projects = JSON.parse(process.env.PROJECTS_JSON);
          const bootstrap = JSON.parse(process.env.BOOTSTRAP_JSON);
          const search = JSON.parse(process.env.SEARCH_JSON);
          const file = JSON.parse(process.env.FILE_JSON);
          const aiSearchInfo = JSON.parse(process.env.AI_SEARCH_INFO_JSON);
          const aiSearch = JSON.parse(process.env.AI_SEARCH_JSON);

          if (!frontend.includes('id="open-source-form"') || !frontend.includes('/app.js')) {
            throw new Error('The production Markdown viewer homepage was not served.');
          }
          if (!viewer.includes('id="open-source-form"') || !viewer.includes('/app.js')) {
            throw new Error('The Markdown viewer SPA fallback route was not served.');
          }
          if (!rawMarkdown.includes('content/') || rawMarkdown.trimStart().startsWith('{')) {
            throw new Error('The raw Markdown route did not return source text.');
          }
          if (
            info.version !== '0.9.0' ||
            info.aiSearch?.storage !== 'built-in-items' ||
            info.aiSearch?.isolation !== 'one-instance-per-project' ||
            info.endpoints?.viewer !== '/p/<project>/<path-to-file.md>'
          ) {
            throw new Error(`Invalid service info response: ${JSON.stringify(info)}`);
          }
          if (health.status !== 'ok' || health.database !== true) {
            throw new Error(`Unhealthy Worker response: ${JSON.stringify(health)}`);
          }
          if (health.kvSeeded !== true) {
            throw new Error(`Production KV bootstrap manifest is missing: ${JSON.stringify(health)}`);
          }
          if (
            health.contentSync?.status !== 'succeeded' ||
            health.contentSync?.manifestHash !== manifest.manifestHash
          ) {
            throw new Error(`Content sync status is invalid: ${JSON.stringify(health.contentSync)}`);
          }
          if (
            Number(health.aiSearch?.projects?.ready ?? 0) < 1 ||
            Number(health.aiSearch?.items?.indexed ?? 0) < 1 ||
            Number(health.aiSearch?.jobs?.failed ?? 0) > 0
          ) {
            throw new Error(`AI Search indexing status is invalid: ${JSON.stringify(health.aiSearch)}`);
          }
          if (!Array.isArray(projects.projects) || !projects.projects.some((item) => item.slug === 'prompt-library')) {
            throw new Error(`Invalid projects response: ${JSON.stringify(projects)}`);
          }
          if (!Number.isInteger(bootstrap.version) || bootstrap.version < 1 || !bootstrap.content) {
            throw new Error(`Invalid bootstrap response: ${JSON.stringify(bootstrap)}`);
          }
          if (
            !Array.isArray(search.results) ||
            !search.results.some((item) => item.id === 'prompt-library-content-sync-guide')
          ) {
            throw new Error(`Synced file was not searchable: ${JSON.stringify(search)}`);
          }
          if (
            file.id !== 'prompt-library-content-sync-guide' ||
            file.uri !== 'prompt://prompt-library/guides/content-sync.md' ||
            !file.content.includes('content/')
          ) {
            throw new Error(`Synced file could not be fetched: ${JSON.stringify(file)}`);
          }
          if (
            aiSearchInfo.storage !== 'built-in-items' ||
            aiSearchInfo.isolation !== 'one-instance-per-project'
          ) {
            throw new Error(`Invalid AI Search discovery response: ${JSON.stringify(aiSearchInfo)}`);
          }
          if (
            !Array.isArray(aiSearch.results) ||
            Number(aiSearch.count ?? 0) < 1 ||
            !aiSearch.results.some((item) => typeof item.uri === 'string' && item.uri.startsWith('prompt://'))
          ) {
            throw new Error(`AI Search did not return a hydrated document: ${JSON.stringify(aiSearch)}`);
          }
          NODE

      - name: Remove local secrets file
        if: always()
        shell: bash
        run: rm -f .wrangler.secrets.json

      - name: Write deployment summary
        if: always()
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Prompt MCP deployment"
            echo
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- D1 migrations, remote KV, atomic Worker secrets, content sync, built-in AI Search priming, semantic search, and production smoke tests are enforced by this job."
          } >> "$GITHUB_STEP_SUMMARY"
