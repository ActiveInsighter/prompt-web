name: Bootstrap Tailwind CSS docs

on:
  push:
    branches:
      - feature/tailwindcss-docs-collector

permissions:
  contents: write

concurrency:
  group: bootstrap-tailwindcss-docs
  cancel-in-progress: false

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tailwindcss-docs-collector

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Collect Tailwind CSS docs
        run: python -m scripts.cli collect tailwindcss_docs --config scripts/configs/tailwindcss-docs.yaml

      - name: Validate collector and generated content
        run: |
          python -m unittest scripts.tests.test_tailwindcss_docs -v
          python -m scripts.cli validate

      - name: Commit generated documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/tailwindcss-docs
          git diff --cached --quiet && exit 0
          git commit -m 'Generate Tailwind CSS documentation'
          git push
