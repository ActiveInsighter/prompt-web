name: Apply AI Search Timeout Recovery

on:
  push:
    branches:
      - fix/ai-search-requeue-timeouts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-requeue-timeouts
          fetch-depth: 0

      - name: Add legacy timeout recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/ai-search-indexing-service.ts')
          text = path.read_text(encoding='utf-8')
          marker = 'export async function reconcileAiSearchJobs(env: Env): Promise<void> {\n'
          if marker not in text:
              raise RuntimeError('reconcileAiSearchJobs marker not found')

          recovery = """export async function reconcileAiSearchJobs(env: Env): Promise<void> {
            // Jobs created by the former uploadAndPoll implementation can be left in
            // terminal failure even though the source file is still current. Reset only
            // that known timeout class; permanent validation failures remain terminal.
            await env.DB.prepare(
              `UPDATE ai_search_jobs
               SET status = 'pending',
                   attempts = 0,
                   next_attempt_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
                   lease_expires_at = NULL,
                   last_error = NULL,
                   updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
                   completed_at = NULL
               WHERE operation = 'upsert_file'
                 AND status = 'failed'
                 AND last_error LIKE '%aborted due to timeout%'
                 AND EXISTS (
                   SELECT 1
                   FROM prompt_search_documents document
                   WHERE document.file_id = ai_search_jobs.file_id
                 )`,
            ).run();

          """
          text = text.replace(marker, recovery, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit recovery patch
        run: |
          rm .github/workflows/apply-ai-search-timeout-requeue.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/ai-search-indexing-service.ts .github/workflows/apply-ai-search-timeout-requeue.yml
          git commit -m "fix: requeue legacy AI Search timeout failures"
          git push origin HEAD:fix/ai-search-requeue-timeouts
