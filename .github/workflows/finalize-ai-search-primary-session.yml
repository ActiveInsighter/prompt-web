name: Finalize AI Search Primary Session

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-d1-primary-session
          fetch-depth: 0

      - name: Normalize status route formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/index.ts')
          text = path.read_text(encoding='utf-8')
          old = """  return context.json(
            await getAiSearchIndexStatus(withPrimaryDatabaseSession(context.env)),
          );
          """
          normalized = """  return context.json(
            await getAiSearchIndexStatus(withPrimaryDatabaseSession(context.env)),
          );
          """
          # Dedent artifacts can be introduced by YAML block scalars. Locate by
          # semantic lines and rewrite the exact source block structurally.
          lines = text.splitlines()
          start = next(
              index for index, line in enumerate(lines)
              if line.strip() == 'return context.json('
              and index > 0
              and "ai-search/status" in '\n'.join(lines[max(0, index - 8):index])
          )
          end = start + 2
          lines[start:end + 1] = [
              '  return context.json(',
              '    await getAiSearchIndexStatus(withPrimaryDatabaseSession(context.env)),',
              '  );',
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit finalized source
        run: |
          rm .github/workflows/finalize-ai-search-primary-session.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts .github/workflows/finalize-ai-search-primary-session.yml
          git commit -m "fix: finalize primary D1 session formatting"
          git push origin HEAD:fix/ai-search-d1-primary-session
