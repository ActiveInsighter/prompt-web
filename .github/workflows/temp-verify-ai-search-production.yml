name: Verify AI Search production

on:
  push:
    branches:
      - verify/ai-search-production

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/ai-search-production
          fetch-depth: 0

      - name: Query production endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github

          query() {
            local name="$1"
            local url="$2"
            local body_file="/tmp/${name}.json"
            local status
            status="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 90 \
              --output "$body_file" --write-out '%{http_code}' "$url")"
            printf '%s' "$status" > "/tmp/${name}.status"
          }

          query info 'https://prompt.2212148739lbw.workers.dev/api/ai-search/info'
          query all 'https://prompt.2212148739lbw.workers.dev/api/ai-search?q=button&limit=3'
          query project 'https://prompt.2212148739lbw.workers.dev/api/ai-search/shadcn-ui-docs?q=button&limit=3'

          python - <<'PY'
          import json
          from pathlib import Path

          cases = {}
          for name in ('info', 'all', 'project'):
              status = int(Path(f'/tmp/{name}.status').read_text())
              raw = Path(f'/tmp/{name}.json').read_text(encoding='utf-8')
              try:
                  body = json.loads(raw)
              except json.JSONDecodeError:
                  body = {'raw': raw[:5000]}
              cases[name] = {'status': status, 'body': body}

          info_ok = (
              cases['info']['status'] == 200
              and cases['info']['body'].get('service') == 'cloudflare-ai-search'
          )
          all_body = cases['all']['body']
          all_ok = (
              cases['all']['status'] == 200
              and all_body.get('engine') == 'cloudflare-ai-search'
              and isinstance(all_body.get('results'), list)
              and len(all_body.get('results', [])) > 0
          )
          project_body = cases['project']['body']
          project_results = project_body.get('results', [])
          project_ok = (
              cases['project']['status'] == 200
              and project_body.get('query', {}).get('project', {}).get('slug') == 'shadcn-ui-docs'
              and isinstance(project_results, list)
              and len(project_results) > 0
              and all(
                  item.get('source', {}).get('project') == 'shadcn-ui-docs'
                  for item in project_results
              )
          )

          report = {
              'passed': info_ok and all_ok and project_ok,
              'checks': {
                  'info': info_ok,
                  'allProjects': all_ok,
                  'projectScoped': project_ok,
              },
              'responses': cases,
          }
          Path('.github/ai-search-production-check.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit verification result
        run: |
          rm .github/workflows/temp-verify-ai-search-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ai-search-production-check.json .github/workflows/temp-verify-ai-search-production.yml
          git commit -m "test: record AI Search production verification"
          git push origin HEAD:verify/ai-search-production
