name: Probe readable AI Search production

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Print compact non-completed AI Search details
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-search/namespaces/prompt-projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          instances="$(curl --fail --silent --show-error --header "$auth" "$api/instances?per_page=100")"

          while IFS= read -r id; do
            all='[]'
            for page in $(seq 1 40); do
              response="$(curl --fail --silent --show-error --header "$auth" "$api/instances/$id/items?per_page=50&page=$page")"
              batch="$(jq '.result // []' <<<"$response")"
              all="$(jq -nc --argjson current "$all" --argjson batch "$batch" '$current + $batch')"
              [[ "$(jq 'length' <<<"$batch")" -lt 50 ]] && break
            done

            while IFS=$'\t' read -r item_id item_key item_status; do
              detail="$(curl --fail --silent --show-error --header "$auth" "$api/instances/$id/items/$item_id")"
              jq -c \
                --arg instance_id "$id" \
                --arg listed_key "$item_key" \
                --arg listed_status "$item_status" \
                '{instance_id:$instance_id,listed_key:$listed_key,listed_status:$listed_status,detail:(.result // . | {id,key,status,chunks_count,error,errors,message,created_at,modified_at})}' \
                <<<"$detail"
            done < <(jq -r '.[] | select(.status != "completed") | [.id,.key,.status] | @tsv' <<<"$all")
          done < <(jq -r '.result[].id' <<<"$instances" | sort)
