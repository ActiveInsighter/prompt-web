name: Fix AI Search typecheck

on:
  push:
    branches:
      - fix/ai-search-runtime-compatibility

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-runtime-compatibility
          fetch-depth: 0
      - name: Apply type annotation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/http/cloudflare-ai-search.ts')
          content = path.read_text(encoding='utf-8')
          old = "    const infoRecord = isRecord(info) ? info : {};"
          new = "    const infoRecord: Record<string, unknown> = isRecord(info) ? info : {};"
          if old not in content:
              raise SystemExit('Expected line not found')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/temp-fix-ai-search-typecheck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/http/cloudflare-ai-search.ts .github/workflows/temp-fix-ai-search-typecheck.yml
          git commit -m "fix: type AI Search instance info as a record"
          git push origin HEAD:fix/ai-search-runtime-compatibility
