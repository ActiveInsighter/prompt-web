name: Apply AI Search ranking fix

on:
  push:
    branches:
      - fix/ai-search-rerank-order

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-search-rerank-order

      - name: Apply retrieval and reranking repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}: {old[:100]!r}')
              file_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} replacement targets, found {count}: {old!r}')
              file_path.write_text(source.replace(old, new), encoding='utf-8')

          utils = 'src/http/cloudflare-ai-search-utils.ts'
          replace_once(
              utils,
              "export type AiSearchRequestedRetrievalType = AiSearchRetrievalType | 'auto';\nexport type AiSearchGrouping = 'files' | 'chunks';",
              "export type AiSearchRequestedRetrievalType = AiSearchRetrievalType | 'auto';\nexport type AiSearchGrouping = 'files' | 'chunks';\n\nexport function resolveExplicitAiSearchRetrievalType(\n  requested: AiSearchRequestedRetrievalType,\n): AiSearchRetrievalType | undefined {\n  return requested === 'auto' ? undefined : requested;\n}",
          )
          replace_once(
              utils,
              "export interface AiSearchResult {\n  id: string;\n  type: string;\n  score: number;\n  text: string;\n  source: AiSearchSource;\n  scoringDetails: Record<string, unknown> | null;\n}\n",
              "export interface AiSearchResult {\n  id: string;\n  type: string;\n  score: number;\n  text: string;\n  source: AiSearchSource;\n  scoringDetails: Record<string, unknown> | null;\n}\n\nexport interface AiSearchResultOrderingOptions {\n  reranking: boolean;\n  requiresMergedRanking: boolean;\n}\n\nexport function getAiSearchRankingScore(result: AiSearchResult): number {\n  const rerankingScore = result.scoringDetails?.reranking_score;\n  return typeof rerankingScore === 'number' && Number.isFinite(rerankingScore)\n    ? rerankingScore\n    : result.score;\n}\n\nexport function orderAiSearchResults(\n  results: AiSearchResult[],\n  options: AiSearchResultOrderingOptions,\n): AiSearchResult[] {\n  if (options.reranking && !options.requiresMergedRanking) return results;\n\n  const rankingScore = options.reranking\n    ? getAiSearchRankingScore\n    : (result: AiSearchResult) => result.score;\n  results.sort((left, right) => rankingScore(right) - rankingScore(left));\n  return results;\n}\n",
          )

          service = 'src/services/ai-search-service.ts'
          replace_once(
              service,
              "  parseAiSearchRequest,\n  type AiSearchChunkLike,",
              "  orderAiSearchResults,\n  parseAiSearchRequest,\n  resolveExplicitAiSearchRetrievalType,\n  type AiSearchChunkLike,",
          )
          replace_once(
              service,
              "function resolveRetrievalType(requested: AiSearchRequestedRetrievalType): AiSearchRetrievalType {\n  return requested === 'auto' ? 'vector' : requested;\n}\n\n",
              "",
          )
          replace_count(
              service,
              "  retrievalType: AiSearchRetrievalType,",
              "  retrievalType: AiSearchRetrievalType | undefined,",
              2,
          )
          replace_once(
              service,
              "        retrieval_type: retrievalType,",
              "        ...(retrievalType ? { retrieval_type: retrievalType } : {}),",
          )
          replace_once(
              service,
              "): Promise<{ searchQuery: string; chunks: AiSearchChunkLike[]; partialErrors: unknown[] }> {",
              "): Promise<{\n  searchQuery: string;\n  chunks: AiSearchChunkLike[];\n  partialErrors: unknown[];\n  requiresMergedRanking: boolean;\n}> {",
          )
          replace_once(
              service,
              "      partialErrors: response.errors ?? [],\n    };",
              "      partialErrors: response.errors ?? [],\n      requiresMergedRanking: false,\n    };",
          )
          replace_once(
              service,
              "    partialErrors: [\n      ...failed,\n      ...successful.flatMap((response) => response.errors ?? []),\n    ],\n  };",
              "    partialErrors: [\n      ...failed,\n      ...successful.flatMap((response) => response.errors ?? []),\n    ],\n    requiresMergedRanking: successful.length > 1,\n  };",
          )
          replace_once(
              service,
              "  options: AiSearchRequestOptions,\n  access: AccessContext,\n  requestUrl: string,",
              "  options: AiSearchRequestOptions,\n  requiresMergedRanking: boolean,\n  access: AccessContext,\n  requestUrl: string,",
          )
          replace_once(
              service,
              "  mapped.sort((left, right) => right.score - left.score);",
              "  orderAiSearchResults(mapped, {\n    reranking: options.reranking,\n    requiresMergedRanking,\n  });",
          )
          replace_once(
              service,
              "  const retrievalType = resolveRetrievalType(options.requestedRetrievalType);",
              "  const retrievalType = resolveExplicitAiSearchRetrievalType(\n    options.requestedRetrievalType,\n  );",
          )
          replace_once(
              service,
              "      options,\n      access,\n      requestUrl,",
              "      options,\n      outcome.requiresMergedRanking,\n      access,\n      requestUrl,",
          )
          replace_once(
              service,
              "        mode: retrievalType,",
              "        mode: options.requestedRetrievalType,",
          )
          replace_once(
              service,
              "      resolvedMode: retrievalType,",
              "      resolvedMode: retrievalType ?? 'instance-default',",
          )

          safe_json = 'src/http/ai-safe-json.ts'
          replace_once(
              safe_json,
              "type CompactAiSearchMode = 'hybrid' | 'keyword' | 'vector';",
              "type CompactAiSearchMode = 'auto' | 'hybrid' | 'keyword' | 'vector';",
          )
          replace_once(
              safe_json,
              "  const mode: CompactAiSearchMode =\n    meta.mode === 'hybrid' || meta.mode === 'keyword' ? meta.mode : 'vector';",
              "  const mode: CompactAiSearchMode =\n    meta.mode === 'auto' || meta.mode === 'hybrid' || meta.mode === 'keyword'\n      ? meta.mode\n      : 'vector';",
          )

          test_search = 'scripts/test-cloudflare-ai-search.mjs'
          replace_once(
              test_search,
              "  AiSearchRequestError,\n  parseAiSearchRequest,",
              "  AiSearchRequestError,\n  orderAiSearchResults,\n  parseAiSearchRequest,\n  resolveExplicitAiSearchRetrievalType,",
          )
          replace_once(
              test_search,
              "assert.deepEqual(\n  parseAiSearchRequest(\n    'https://prompt.example.com/api/ai-search?q=%E5%8F%98%E9%99%90%E7%A7%AF%E5%88%86&group=chunks&limit=20&mode=vector&threshold=0.25&context=2&rerank=true',",
              "assert.equal(resolveExplicitAiSearchRetrievalType('auto'), undefined);\nassert.equal(resolveExplicitAiSearchRetrievalType('hybrid'), 'hybrid');\n\nconst cloudflareOrder = [\n  { id: 'reranked-first', score: 0.2, scoringDetails: { reranking_score: 0.9 } },\n  { id: 'reranked-second', score: 0.95, scoringDetails: { reranking_score: 0.1 } },\n];\nassert.deepEqual(\n  orderAiSearchResults([...cloudflareOrder], {\n    reranking: true,\n    requiresMergedRanking: false,\n  }).map((result) => result.id),\n  ['reranked-first', 'reranked-second'],\n  'A single Cloudflare reranked response must retain its upstream order.',\n);\nassert.deepEqual(\n  orderAiSearchResults(\n    [\n      { id: 'raw-high', score: 0.95, scoringDetails: { reranking_score: 0.2 } },\n      { id: 'rerank-high', score: 0.3, scoringDetails: { reranking_score: 0.9 } },\n      { id: 'fallback-score', score: 0.8, scoringDetails: null },\n    ],\n    { reranking: true, requiresMergedRanking: true },\n  ).map((result) => result.id),\n  ['rerank-high', 'fallback-score', 'raw-high'],\n  'Multiple Cloudflare response batches must merge by reranking_score with score fallback.',\n);\nassert.deepEqual(\n  orderAiSearchResults([...cloudflareOrder], {\n    reranking: false,\n    requiresMergedRanking: false,\n  }).map((result) => result.id),\n  ['reranked-second', 'reranked-first'],\n  'Non-reranked results must continue to sort by the upstream score.',\n);\n\nassert.deepEqual(\n  parseAiSearchRequest(\n    'https://prompt.example.com/api/ai-search?q=%E5%8F%98%E9%99%90%E7%A7%AF%E5%88%86&group=chunks&limit=20&mode=vector&threshold=0.25&context=2&rerank=true',",
          )
          replace_once(
              test_search,
              "assert.doesNotMatch(serviceSource, /prompt\\.local/u, 'MCP results must not expose prompt.local URLs.');",
              "assert.doesNotMatch(serviceSource, /prompt\\.local/u, 'MCP results must not expose prompt.local URLs.');\nassert.doesNotMatch(\n  serviceSource,\n  /requested === 'auto' \\? 'vector'/u,\n  'auto retrieval must not be forced to vector.',\n);\nassert.match(\n  serviceSource,\n  /\\.\\.\\.\\(retrievalType\\s*\\?\\s*\\{ retrieval_type: retrievalType \\}\\s*:\\s*\\{\\}\\)/u,\n  'auto retrieval must omit retrieval_type from the Cloudflare request.',\n);",
          )

          test_safe = 'scripts/test-ai-safe-json.mjs'
          replace_once(
              test_safe,
              "for (const mode of ['hybrid', 'keyword']) {",
              "for (const mode of ['auto', 'hybrid', 'keyword']) {",
          )
          replace_once(
              test_safe,
              "    assert.equal(parsed.meta.mode, mode, `Resolved ${mode} mode must be preserved.`);",
              "    assert.equal(parsed.meta.mode, mode, `Requested ${mode} mode must be preserved.`);",
          )

          replace_once(
              'docs/cloudflare-ai-search.md',
              "| `mode` | `auto` | `auto`, `vector`, `keyword`, or `hybrid`; `auto` resolves to vector. |",
              "| `mode` | `auto` | `auto`, `vector`, `keyword`, or `hybrid`; `auto` leaves `retrieval_type` unset so the instance configuration decides. |",
          )

          Path('.github/workflows/apply-ai-search-ranking-fix.yml').unlink()
          PY

      - name: Verify focused tests
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run typecheck
          npm run test:cloudflare-ai-search
          npm run test:ai-safe-json

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/ai-search-service.ts \
            src/http/cloudflare-ai-search-utils.ts \
            src/http/ai-safe-json.ts \
            scripts/test-cloudflare-ai-search.mjs \
            scripts/test-ai-safe-json.mjs \
            docs/cloudflare-ai-search.md \
            .github/workflows/apply-ai-search-ranking-fix.yml
          git commit -m 'fix AI Search retrieval and rerank ordering'
          git push origin HEAD:fix/ai-search-rerank-order
