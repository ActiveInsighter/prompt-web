name: Capture latest Actions log

on:
  workflow_run:
    workflows:
      - Prompt Web CI
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: prompt-web-actions-log-main
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch completed run metadata and job logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/get-latest-run.mjs --run-id "$TARGET_RUN_ID" --logs --write

      - name: Commit latest Actions log
        run: node scripts/git-commit-state.mjs "Record latest Actions log [skip ci]"
